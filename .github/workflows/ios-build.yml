name: iOS Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      APP_BUNDLE_ID: com.rrlime.falora
      APPLE_TEAM_ID: R8A8VT6R34

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Validate signing secrets
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$BUILD_CERTIFICATE_BASE64"
          test -n "$P12_PASSWORD"
          test -n "$BUILD_PROVISION_PROFILE_BASE64"
          test -n "$KEYCHAIN_PASSWORD"

      - name: Install and validate signing assets
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          CERTIFICATE_PATH="$RUNNER_TEMP/apple-distribution.p12"
          PROFILE_SOURCE_PATH="$RUNNER_TEMP/app-store.mobileprovision"
          PROFILE_PLIST_PATH="$RUNNER_TEMP/app-store-profile.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE_SOURCE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE_SOURCE_PATH" > "$PROFILE_PLIST_PATH"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST_PATH")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST_PATH")
          PROFILE_TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST_PATH")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST_PATH")
          PROFILE_APS_ENV=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$PROFILE_PLIST_PATH")
          PROFILE_GET_TASK_ALLOW=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$PROFILE_PLIST_PATH")

          test "$PROFILE_TEAM_ID" = "$APPLE_TEAM_ID"
          test "$PROFILE_APP_ID" = "$APPLE_TEAM_ID.$APP_BUNDLE_ID"
          test "$PROFILE_APS_ENV" = "production"
          test "$PROFILE_GET_TASK_ALLOW" = "false"
          if /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$PROFILE_PLIST_PATH" >/dev/null 2>&1; then
            echo "The provisioning profile is not an App Store distribution profile." >&2
            exit 1
          fi

          PROFILE_INSTALL_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_INSTALL_PATH="$PROFILE_INSTALL_DIR/$PROFILE_UUID.mobileprovision"
          mkdir -p "$PROFILE_INSTALL_DIR"
          cp "$PROFILE_SOURCE_PATH" "$PROFILE_INSTALL_PATH"

          {
            echo "PROFILE_UUID=$PROFILE_UUID"
            echo "PROFILE_NAME=$PROFILE_NAME"
            echo "PROFILE_INSTALL_PATH=$PROFILE_INSTALL_PATH"
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
          } >> "$GITHUB_ENV"

          {
            echo "APPSTORE_PROVISIONING_PROFILE = $PROFILE_NAME"
          } > ios/Flutter/Signing.xcconfig

          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q 'Apple Distribution'

      - name: Create App Store export options
        run: |
          set -euo pipefail
          EXPORT_OPTIONS_PATH="$RUNNER_TEMP/ExportOptions.plist"

          /usr/libexec/PlistBuddy -c 'Clear dict' "$EXPORT_OPTIONS_PATH"
          /usr/libexec/PlistBuddy -c 'Add :method string app-store-connect' "$EXPORT_OPTIONS_PATH"
          /usr/libexec/PlistBuddy -c 'Add :destination string export' "$EXPORT_OPTIONS_PATH"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string manual' "$EXPORT_OPTIONS_PATH"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" "$EXPORT_OPTIONS_PATH"
          /usr/libexec/PlistBuddy -c 'Add :signingCertificate string Apple Distribution' "$EXPORT_OPTIONS_PATH"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$EXPORT_OPTIONS_PATH"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$APP_BUNDLE_ID string $PROFILE_NAME" "$EXPORT_OPTIONS_PATH"
          /usr/libexec/PlistBuddy -c 'Add :manageAppVersionAndBuildNumber bool false' "$EXPORT_OPTIONS_PATH"
          /usr/libexec/PlistBuddy -c 'Add :stripSwiftSymbols bool true' "$EXPORT_OPTIONS_PATH"

          echo "EXPORT_OPTIONS_PATH=$EXPORT_OPTIONS_PATH" >> "$GITHUB_ENV"

      - name: Build signed App Store IPA
        run: flutter build ipa --release --export-options-plist="$EXPORT_OPTIONS_PATH"

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: tombik-teyze-ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload IPA to App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077

          test -n "$APP_STORE_CONNECT_KEY_ID"
          test -n "$APP_STORE_CONNECT_ISSUER_ID"
          test -n "$APP_STORE_CONNECT_PRIVATE_KEY"

          UPLOAD_TEMP_DIR="$RUNNER_TEMP/appstoreconnect-upload"
          API_KEY_DIR="$UPLOAD_TEMP_DIR/private_keys"
          API_KEY_PATH="$API_KEY_DIR/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8"
          mkdir -p "$API_KEY_DIR"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"

          if ! grep -q -- 'BEGIN PRIVATE KEY' "$API_KEY_PATH"; then
            echo "::error::APP_STORE_CONNECT_PRIVATE_KEY is not a valid PEM private key."
            exit 1
          fi

          shopt -s nullglob
          IPA_FILES=("$GITHUB_WORKSPACE"/build/ios/ipa/*.ipa)
          if [ "${#IPA_FILES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one IPA in build/ios/ipa, found ${#IPA_FILES[@]}."
            exit 1
          fi
          IPA_PATH="${IPA_FILES[0]}"

          cd "$UPLOAD_TEMP_DIR"
          if ! xcrun altool \
            --validate-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"; then
            echo "::error::Apple rejected IPA validation. Review the altool diagnostics above."
            exit 1
          fi

          if ! xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"; then
            echo "::error::App Store Connect upload failed. Review the altool diagnostics above."
            exit 1
          fi

      - name: Clean up signing assets
        if: always()
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          rm -f \
            "$RUNNER_TEMP/apple-distribution.p12" \
            "$RUNNER_TEMP/app-store.mobileprovision" \
            "$RUNNER_TEMP/app-store-profile.plist" \
            "$RUNNER_TEMP/ExportOptions.plist" \
            ios/Flutter/Signing.xcconfig

          UPLOAD_TEMP_DIR="$RUNNER_TEMP/appstoreconnect-upload"
          if [[ "$UPLOAD_TEMP_DIR" == "$RUNNER_TEMP/"* ]] && [ -d "$UPLOAD_TEMP_DIR" ]; then
            rm -rf -- "$UPLOAD_TEMP_DIR"
          fi

          if [ -n "${PROFILE_INSTALL_PATH:-}" ]; then
            rm -f "$PROFILE_INSTALL_PATH"
          fi

          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
