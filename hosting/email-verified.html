<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>E-posta Doğrulama — Tombik Teyze</title>
  <style>
    :root {
      --bg: #f7f0e4;
      --ink: #2a2118;
      --muted: #6b5a45;
      --ok: #2f6b3a;
      --err: #8b2e2e;
      --card: #fffdf8;
      --line: #e4d6c2;
      --accent: #8b4513;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse at top, #fff8ec 0%, transparent 55%),
        var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 28px 24px 24px;
      box-shadow: 0 10px 28px rgba(42, 33, 24, 0.08);
      text-align: center;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.35rem;
      font-weight: 700;
    }
    p {
      margin: 0 0 12px;
      line-height: 1.55;
      color: var(--muted);
      font-size: 1rem;
    }
    .status { min-height: 4.5rem; }
    .ok { color: var(--ok); }
    .err { color: var(--err); }
    .code {
      display: inline-block;
      margin-top: 6px;
      padding: 6px 10px;
      border-radius: 8px;
      background: #f3e8da;
      color: var(--err);
      font-family: ui-monospace, Consolas, monospace;
      font-size: 0.85rem;
      word-break: break-all;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 18px;
    }
    a.btn {
      display: block;
      text-decoration: none;
      padding: 12px 16px;
      border-radius: 10px;
      font-family: system-ui, sans-serif;
      font-weight: 600;
      font-size: 0.95rem;
    }
    a.primary {
      background: var(--accent);
      color: #fff;
    }
    a.secondary {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--line);
    }
    .spinner {
      width: 28px;
      height: 28px;
      margin: 8px auto 12px;
      border: 3px solid #e4d6c2;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .brand {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 14px;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">Tombik Teyze</div>
    <div id="loading" class="status">
      <div class="spinner" aria-hidden="true"></div>
      <p>E-posta doğrulaması kontrol ediliyor…</p>
    </div>
    <div id="success" class="status" hidden>
      <h1 class="ok">Doğrulama başarılı</h1>
      <p class="ok">E-posta adresiniz doğrulandı, uygulamaya dönebilirsiniz</p>
    </div>
    <div id="error" class="status" hidden>
      <h1 class="err">Doğrulama başarısız</h1>
      <p id="errorMessage">Bağlantı işlenemedi.</p>
      <div id="errorCode" class="code" hidden></div>
    </div>
    <div class="actions">
      <a class="btn primary" href="intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=com.rrlime.falora;end">
        Uygulamayı aç
      </a>
      <a class="btn secondary" href="https://play.google.com/store/apps/details?id=com.rrlime.falora">
        Play Store’da aç
      </a>
    </div>
  </main>

  <!-- Firebase config: lib/firebase_options.dart (web) ile aynı -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script>
    (function () {
      var loadingEl = document.getElementById('loading');
      var successEl = document.getElementById('success');
      var errorEl = document.getElementById('error');
      var errorMessageEl = document.getElementById('errorMessage');
      var errorCodeEl = document.getElementById('errorCode');

      function showSuccess() {
        loadingEl.hidden = true;
        errorEl.hidden = true;
        successEl.hidden = false;
      }

      function showError(message, code) {
        loadingEl.hidden = true;
        successEl.hidden = true;
        errorEl.hidden = false;
        errorMessageEl.textContent = message || 'Doğrulama tamamlanamadı.';
        if (code) {
          errorCodeEl.hidden = false;
          errorCodeEl.textContent = String(code);
        } else {
          errorCodeEl.hidden = true;
        }
      }

      var params = new URLSearchParams(window.location.search);
      var mode = params.get('mode');
      var oobCode = params.get('oobCode');
      var urlErrorCode =
        params.get('errorCode') ||
        params.get('firebaseError') ||
        params.get('error');

      if (urlErrorCode) {
        showError('E-posta doğrulanamadı.', urlErrorCode);
        return;
      }

      // Firebase /__/auth/action başarıdan sonra continueUrl'e yönlendirir (çoğu zaman kodsuz).
      if (!oobCode) {
        showSuccess();
        return;
      }

      if (mode && mode !== 'verifyEmail' && mode !== 'resetPassword' && mode !== 'recoverEmail') {
        showError('Desteklenmeyen işlem.', mode);
        return;
      }

      firebase.initializeApp({
        apiKey: 'AIzaSyCqVS_DSnsv9V8Rm9NpJLmVTn45Hde7PXs',
        authDomain: 'tombikteyze.firebaseapp.com',
        projectId: 'tombikteyze',
        storageBucket: 'tombikteyze.firebasestorage.app',
        messagingSenderId: '36770284037',
        appId: '1:36770284037:web:3928a19e47f183c79ad26c',
      });

      var auth = firebase.auth();

      auth
        .applyActionCode(oobCode)
        .then(function () {
          showSuccess();
        })
        .catch(function (err) {
          var code = (err && err.code) || 'unknown';
          var message = 'E-posta doğrulanamadı.';
          if (code === 'auth/invalid-action-code') {
            message = 'Bağlantı geçersiz veya daha önce kullanılmış.';
          } else if (code === 'auth/expired-action-code') {
            message = 'Bağlantının süresi dolmuş. Uygulamadan yeni doğrulama e-postası isteyin.';
          } else if (code === 'auth/user-disabled') {
            message = 'Bu hesap devre dışı bırakılmış.';
          } else if (code === 'auth/user-not-found') {
            message = 'Kullanıcı bulunamadı.';
          }
          showError(message, code);
        });
    })();
  </script>
</body>
</html>
